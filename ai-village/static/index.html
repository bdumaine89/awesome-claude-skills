<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1 id="title">AI Village</h1>
  <div class="clock"><span id="day">Day 1</span> <strong id="time">06:00</strong> <span id="brain" class="pill"></span></div>
  <div class="controls">
    <button id="pause">Pause</button>
    <label>Speed <select id="speed">
      <option value="0.5">½×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option>
    </select></label>
  </div>
</header>
<main>
  <section class="map-wrap"><canvas id="map"></canvas><div id="tooltip" hidden></div></section>
  <aside>
    <div class="card">
      <h2>Villagers</h2>
      <ul id="villagers"></ul>
    </div>
    <div class="card">
      <h2>Drop a request at Town Hall</h2>
      <form id="taskForm">
        <input name="title" placeholder="e.g. Research rec hockey leagues near me" required maxlength="120">
        <textarea name="detail" rows="2" placeholder="Details (optional)"></textarea>
        <div class="row">
          <select name="kind">
            <option value="general">Let the Mayor decide</option>
            <option value="research">Research → Library</option>
            <option value="email">Email draft → Post Office</option>
            <option value="digest">Digest → Noticeboard</option>
          </select>
          <button type="submit">Post</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Task board</h2>
      <ul id="tasks"></ul>
    </div>
    <div class="card">
      <h2>Village log</h2>
      <ul id="events"></ul>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
