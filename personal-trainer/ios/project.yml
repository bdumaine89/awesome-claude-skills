# XcodeGen spec: `brew install xcodegen && xcodegen generate` → BlueLine.xcodeproj
# Change BL_IOS_BUNDLE_ID and DEVELOPMENT_TEAM before installing on a device.
name: BlueLine
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # your Apple Developer Team ID
    BL_IOS_BUNDLE_ID: com.example.blueline

packages:
  BlueLineCore:
    path: BlueLineCore

targets:
  BlueLine:
    type: application
    platform: iOS
    sources:
      - path: BlueLine
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: BlueLineCore
      - target: BlueLineWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_NAME: BlueLine
        PRODUCT_BUNDLE_IDENTIFIER: $(BL_IOS_BUNDLE_ID)
        INFOPLIST_FILE: BlueLine/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlueLine/BlueLine.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  BlueLineWatch:
    type: application
    platform: watchOS
    sources:
      - path: BlueLineWatch
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: BlueLineCore
    settings:
      base:
        PRODUCT_NAME: BlueLineWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(BL_IOS_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: BlueLineWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlueLineWatch/BlueLineWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  BlueLineCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlueLineCore/Tests/BlueLineCoreTests
    dependencies:
      - package: BlueLineCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BL_IOS_BUNDLE_ID).coretests

schemes:
  BlueLine:
    build:
      targets:
        BlueLine: all
        BlueLineCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlueLineCoreTests
  BlueLineWatch:
    build:
      targets:
        BlueLineWatch: all
    run:
      config: Debug
